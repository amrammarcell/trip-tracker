<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trip & Split Bill Tracker</title>
  <meta name="description" content="Itinerary dan split bill perjalanan, tersinkron dengan Google Sheet.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <!-- iOS: home-screen icon, full-screen standalone, status bar over the gradient header -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Trip Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div>
        <div class="eyebrow" id="tripDates">—</div>
        <h1 id="tripName">Memuat…</h1>
        <div class="members" id="memberChips"></div>
      </div>
      <div class="top-actions">
        <button class="btn ghost sync-btn" id="btnSync" title="Sinkron dengan Google Sheet"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">Sync</span></button>
        <button class="btn ghost" id="btnSettings" title="Pengaturan trip" aria-label="Pengaturan">⚙<span class="btn-text"> Pengaturan</span></button>
      </div>
    </div>
    <nav class="wrap tabs" id="tabs" aria-label="Menu utama">
      <button data-tab="dashboard" class="active"><span class="tab-ico" aria-hidden="true">🏠</span><span class="tab-lbl">Ringkasan</span></button>
      <button data-tab="itinerary"><span class="tab-ico" aria-hidden="true">🗓️</span><span class="tab-lbl">Itinerary</span></button>
      <button data-tab="expenses"><span class="tab-ico" aria-hidden="true">🧾</span><span class="tab-lbl">Pengeluaran</span></button>
      <button data-tab="split"><span class="tab-ico" aria-hidden="true">💸</span><span class="tab-lbl">Split Bill</span></button>
    </nav>
  </header>

  <main class="wrap" id="view"></main>

  <div class="install-bar" id="installBar" hidden>
    <img src="icons/icon-192.png" alt="" width="40" height="40">
    <div class="install-text"><b>Pasang di HP</b><span id="installHint">Buka seperti aplikasi, bisa offline.</span></div>
    <button type="button" class="btn sm" id="installBtn">Pasang</button>
    <button type="button" class="icon-btn" id="installClose" aria-label="Tutup">✕</button>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Tutup">✕</button>
      </div>
      <div id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </form>
  </dialog>

  <dialog id="confirmDlg" class="confirm">
    <form method="dialog">
      <div class="confirm-body">
        <div class="confirm-icon">!</div>
        <div><h2 id="confirmTitle"></h2><p id="confirmMsg" class="sub"></p></div>
      </div>
      <div class="modal-foot">
        <button value="no" class="btn ghost">Batal</button>
        <button value="yes" class="btn btn-danger" id="confirmOk">Hapus</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"><span id="toastMsg"></span><button type="button" id="toastUndo">Urungkan</button></div>
  <script src="config.js"></script>
  <script src="sheet-import.js"></script>
  <script src="app.js"></script>
</body>
</html>
